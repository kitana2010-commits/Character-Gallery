<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Libre+Franklin:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0c0b0f;
    --bg-raised: #14131a;
    --bg-card: #1a1921;
    --text: #e4e0d8;
    --text-dim: #7a7770;
    --text-faint: #4a4843;
    --accent: #d4a574;
    --accent-glow: #d4a57430;
    --border: #252330;
    --border-hover: #3a3848;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Libre Franklin', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ── Landing Page ── */
  .landing { min-height: 100vh; }

  .hero {
    padding: 80px 40px 50px;
    text-align: center;
  }
  .hero-line {
    width: 40px;
    height: 1px;
    background: var(--accent);
    margin: 0 auto 32px;
    animation: fadeIn 1s ease 0.2s both;
  }
  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(36px, 6vw, 64px);
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--text);
    animation: fadeUp 0.8s ease 0.3s both;
  }
  .hero h1 span { color: var(--accent); }
  .hero-sub {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 16px;
    animation: fadeUp 0.8s ease 0.5s both;
  }

  /* ── Section Headers ── */
  .section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px;
  }
  @media (max-width: 600px) { .section { padding: 0 16px; } }

  .section-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 48px;
    margin-bottom: 28px;
    animation: fadeUp 0.6s ease both;
  }
  .section-header::before,
  .section-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .section-header::before {
    max-width: 60px;
    background: linear-gradient(90deg, transparent, var(--border));
  }
  .section-header::after {
    background: linear-gradient(90deg, var(--border), transparent);
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(18px, 3vw, 26px);
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  /* ── Character Grid ── */
  .char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 22px;
    margin-bottom: 20px;
  }
  @media (max-width: 600px) {
    .char-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
  }

  .char-card {
    animation: fadeUp 0.6s ease both;
    cursor: pointer;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border);
    transition: border-color 0.4s ease, transform 0.35s ease, box-shadow 0.4s ease;
  }
  .char-card:hover {
    border-color: var(--accent);
    transform: translateY(-6px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.4), 0 0 0 1px var(--accent-glow);
  }
  .char-card-img-wrap {
    overflow: hidden;
    position: relative;
  }
  .char-card-img-wrap::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to top, var(--bg-card), transparent);
    pointer-events: none;
  }
  .char-card-img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    filter: saturate(0.85);
    transition: filter 0.4s ease, transform 0.6s ease;
  }
  .char-card:hover .char-card-img {
    filter: saturate(1);
    transform: scale(1.04);
  }

  /* Placeholder for characters without images */
  .char-card-placeholder {
    width: 100%;
    aspect-ratio: 3 / 4;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #1a1921, #0f0e14);
    position: relative;
  }
  .char-card-placeholder .initial {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    font-weight: 300;
    color: var(--border-hover);
    transition: color 0.4s ease;
  }
  .char-card:hover .char-card-placeholder .initial {
    color: var(--accent);
  }
  .char-card-placeholder .placeholder-label {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-faint);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .char-card-info { padding: 16px 18px 20px; position: relative; }
  .char-card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 2px;
    transition: color 0.3s ease;
  }
  .char-card:hover .char-card-name { color: var(--accent); }
  .char-card-count {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-top: 4px;
  }
  .char-card-arrow {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%) translateX(-6px);
    color: var(--text-faint);
    font-size: 18px;
    transition: transform 0.3s ease, color 0.3s ease;
  }
  .char-card:hover .char-card-arrow {
    transform: translateY(-50%) translateX(0);
    color: var(--accent);
  }

  /* ── Gallery Page ── */
  .gallery-page {
    display: none;
    min-height: 100vh;
    animation: fadeIn 0.4s ease;
  }
  .gallery-page.active { display: block; }

  .gallery-header {
    padding: 40px 40px 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
    animation: slideIn 0.5s ease;
  }
  @media (max-width: 600px) {
    .gallery-header { padding: 24px 16px 20px; gap: 16px; }
  }
  .back-btn {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Libre Franklin', sans-serif;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.3s, color 0.3s;
    letter-spacing: 1px;
    flex-shrink: 0;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .gallery-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(24px, 4vw, 40px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .gallery-group {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .gallery-count {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .gallery-divider {
    height: 1px;
    background: linear-gradient(90deg, var(--accent), var(--border) 50%, transparent);
    margin: 0 40px;
    max-width: 1120px;
  }
  @media (max-width: 600px) { .gallery-divider { margin: 0 16px; } }

  .gallery-grid {
    columns: 3;
    column-gap: 14px;
    padding: 32px 40px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 900px) { .gallery-grid { columns: 2; } }
  @media (max-width: 600px) { .gallery-grid { columns: 2; column-gap: 10px; padding: 20px 16px 60px; } }
  @media (max-width: 400px) { .gallery-grid { columns: 1; max-width: 360px; } }

  .gallery-item {
    break-inside: avoid;
    margin-bottom: 14px;
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.3s ease, border-color 0.3s ease;
    animation: fadeUp 0.5s ease both;
    position: relative;
  }
  .gallery-item:hover {
    transform: translateY(-3px);
    border-color: var(--border-hover);
  }
  .gallery-item:hover .item-overlay { opacity: 1; }
  .gallery-item img {
    display: block;
    width: 100%;
    height: auto;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .gallery-item img.loaded { opacity: 1; }
  .item-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px 12px 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .item-caption {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 1px;
  }

  /* ── Empty gallery state ── */
  .gallery-empty {
    text-align: center;
    padding: 100px 40px;
    animation: fadeUp 0.5s ease;
  }
  .gallery-empty-icon {
    font-size: 48px;
    color: var(--text-faint);
    margin-bottom: 20px;
  }
  .gallery-empty p {
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(5,5,8,0.95);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .lightbox.open { display: flex; animation: fadeIn 0.25s ease; }
  .lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .lb-btn {
    position: absolute;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.2s;
    font-family: 'Libre Franklin', sans-serif;
  }
  .lb-btn:hover { color: var(--accent); }
  .lb-close { top: 24px; right: 28px; font-size: 28px; }
  .lb-nav { top: 50%; transform: translateY(-50%); font-size: 36px; padding: 16px; }
  .lb-prev { left: 16px; }
  .lb-next { right: 16px; }
  .lb-caption {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--accent);
    background: rgba(12,11,15,0.7);
    padding: 8px 24px;
    border-radius: 24px;
    border: 1px solid var(--accent-glow);
    white-space: nowrap;
  }

  .footer {
    text-align: center;
    padding: 40px 24px 24px;
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- ── Landing Page ── -->
<div class="landing" id="landing">
  <header class="hero">
    <div class="hero-line"></div>
    <h1>Character <span>Gallery</span></h1>
    <p class="hero-sub">Select a character to view their collection</p>
  </header>

  <div id="sections"></div>

  <div class="footer">Character Gallery</div>
</div>

<!-- ── Gallery Page ── -->
<div class="gallery-page" id="galleryPage">
  <div class="gallery-header">
    <button class="back-btn" onclick="goHome()">&#8592; Back</button>
    <div>
      <div class="gallery-group" id="galleryGroup"></div>
      <h2 class="gallery-title" id="galleryTitle"></h2>
    </div>
    <span class="gallery-count" id="galleryCount"></span>
  </div>
  <div class="gallery-divider"></div>
  <div id="galleryContent"></div>
  <div class="footer">Character Gallery</div>
</div>

<!-- ── Lightbox ── -->
<div class="lightbox" id="lightbox">
  <button class="lb-btn lb-close" onclick="closeLightbox()">&#215;</button>
  <button class="lb-btn lb-nav lb-prev" onclick="lbNav(-1)">&#8249;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-nav lb-next" onclick="lbNav(1)">&#8250;</button>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════════════════╗
// ║                                                                    ║
// ║   YOUR CHARACTERS GO HERE!                                         ║
// ║                                                                    ║
// ║   Organized by group/series. Each group has a title and            ║
// ║   an array of characters.                                          ║
// ║                                                                    ║
// ║   Each character has:                                              ║
// ║     name   — display name on the card                              ║
// ║     cover  — image for the landing card (or "" for placeholder)    ║
// ║     images — array of { src, caption } for their gallery           ║
// ║                                                                    ║
// ║   To add images: use URLs or local paths like                      ║
// ║   "images/ash-concert.png" (put files in an images/ folder)        ║
// ║                                                                    ║
// ╚══════════════════════════════════════════════════════════════════════╝

const GROUPS = [
  {
    title: "The Street Rats",
    characters: [
      {
        name: "Ash",
        cover: "images/ash.png",
        images: [
          { src: "images/ash.png", caption: "Guitar" },
        ]
      },
      {
        name: "Skye",
        cover: "images/skye.png",
        images: [
          { src: "images/skye.png", caption: "Bass" },
        ]
      },
      {
        name: "Sin",
        cover: "images/sin.png",
        images: [
          { src: "images/sin.png", caption: "Vocalist" },
        ]
      },
      {
        name: "Mason",
        cover: "images/mason.png",
        images: [
          { src: "images/mason.png", caption: "Drums" },
        ]
      },
    ]
  },
  {
    title: "ACOTAR",
    characters: [
      {
        name: "Rhysand",
        cover: "",
        images: []
      },
      {
        name: "Azriel",
        cover: "",
        images: []
      },
      {
        name: "Cassian",
        cover: "",
        images: []
      },
      {
        name: "Amren",
        cover: "",
        images: []
      },
      {
        name: "Eris",
        cover: "",
        images: []
      },
      {
        name: "Tamlin",
        cover: "",
        images: []
      },
      {
        name: "Lucien",
        cover: "",
        images: []
      },
    ]
  },
];

// ── Build the landing page ──

const sectionsEl = document.getElementById('sections');
let charIndex = 0;

GROUPS.forEach((group) => {
  const section = document.createElement('div');
  section.className = 'section';

  // Section header
  const header = document.createElement('div');
  header.className = 'section-header';
  header.innerHTML = `<span class="section-title">${group.title}</span>`;
  section.appendChild(header);

  // Character grid
  const grid = document.createElement('div');
  grid.className = 'char-grid';

  group.characters.forEach((char, i) => {
    const globalIdx = charIndex++;
    const card = document.createElement('div');
    card.className = 'char-card';
    card.style.animationDelay = `${i * 0.08}s`;
    card.onclick = () => openGallery(group.title, char);

    let imgHTML;
    if (char.cover) {
      imgHTML = `
        <div class="char-card-img-wrap">
          <img class="char-card-img" src="${char.cover}" alt="${char.name}"
               onload="this.style.opacity=1" style="opacity:0;transition:opacity 0.5s">
        </div>`;
    } else {
      imgHTML = `
        <div class="char-card-img-wrap">
          <div class="char-card-placeholder">
            <span class="initial">${char.name.charAt(0)}</span>
            <span class="placeholder-label">No images yet</span>
          </div>
        </div>`;
    }

    const count = char.images.length;
    card.innerHTML = `
      ${imgHTML}
      <div class="char-card-info">
        <div class="char-card-name">${char.name}</div>
        <div class="char-card-count">${count} image${count !== 1 ? 's' : ''}</div>
        <div class="char-card-arrow">&rarr;</div>
      </div>
    `;
    grid.appendChild(card);
  });

  section.appendChild(grid);
  sectionsEl.appendChild(section);
});

// ── Gallery ──

const landing        = document.getElementById('landing');
const galleryPage    = document.getElementById('galleryPage');
const galleryGroup   = document.getElementById('galleryGroup');
const galleryTitle   = document.getElementById('galleryTitle');
const galleryCount   = document.getElementById('galleryCount');
const galleryContent = document.getElementById('galleryContent');

let lbImages = [];
let lbIndex  = 0;

function openGallery(groupName, char) {
  lbImages = char.images;
  galleryGroup.textContent = groupName;
  galleryTitle.textContent = char.name;
  galleryCount.textContent = char.images.length + ' image' + (char.images.length !== 1 ? 's' : '');

  galleryContent.innerHTML = '';

  if (char.images.length === 0) {
    galleryContent.innerHTML = `
      <div class="gallery-empty">
        <div class="gallery-empty-icon">&#9744;</div>
        <p>No images yet &mdash; add some to the images array for ${char.name}</p>
      </div>`;
  } else {
    const grid = document.createElement('div');
    grid.className = 'gallery-grid';
    char.images.forEach((img, j) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.style.animationDelay = `${j * 0.06}s`;
      item.onclick = () => openLightbox(j);
      item.innerHTML = `
        <img src="${img.src}" alt="${img.caption || ''}"
             onload="this.classList.add('loaded')">
        ${img.caption ? `<div class="item-overlay"><div class="item-caption">${img.caption}</div></div>` : ''}
      `;
      grid.appendChild(item);
    });
    galleryContent.appendChild(grid);
  }

  landing.style.display = 'none';
  galleryPage.classList.add('active');
  window.scrollTo(0, 0);
}

function goHome() {
  galleryPage.classList.remove('active');
  landing.style.display = '';
  window.scrollTo(0, 0);
}

// ── Lightbox ──

const lightbox  = document.getElementById('lightbox');
const lbImg     = document.getElementById('lbImg');
const lbCaption = document.getElementById('lbCaption');

function openLightbox(i) {
  lbIndex = i;
  updateLightbox();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}
function lbNav(dir) {
  event.stopPropagation();
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  updateLightbox();
}
function updateLightbox() {
  lbImg.src = lbImages[lbIndex].src;
  lbCaption.textContent = lbImages[lbIndex].caption || '';
}

lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape')    closeLightbox();
  if (e.key === 'ArrowLeft')  lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});
</script>

</body>
</html>
