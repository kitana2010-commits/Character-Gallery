<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Eurielle's Gallery ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Italiana&family=Quicksand:wght@300;400;500;600&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #020008;
    --bg-raised: #0c1028;
    --bg-card: rgba(10,15,35,0.6);
    --text: #e8e4f0;
    --text-dim: #8a92b0;
    --text-faint: #4d5578;
    --accent: #c8a0d8;
    --accent-glow: #c8a0d830;
    --accent-warm: #e0b0a0;
    --border: #1e2848;
    --border-hover: #3a4570;
    --spicy: #d45c8a;
    --spicy-glow: #d45c8a30;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Quicksand', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  #starCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  #shootingStarContainer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .aurora-band {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes shimmer {
    0% { background-position: 200% center; }
    100% { background-position: -200% center; }
  }
  @keyframes gentlePulse {
    0%,100% { text-shadow: 0 0 20px rgba(220,190,240,0.25), 0 0 60px rgba(180,140,220,0.1); }
    50% { text-shadow: 0 0 35px rgba(220,200,255,0.45), 0 0 80px rgba(180,140,220,0.2), 0 0 140px rgba(140,100,200,0.08); }
  }
  @keyframes aurora {
    0%,100% { opacity: 0.04; transform: translateX(-5%) scaleY(1); }
    50% { opacity: 0.1; transform: translateX(5%) scaleY(1.15); }
  }
  @keyframes shootingStar {
    0% { transform: translateX(0) translateY(0); opacity: 0; }
    5% { opacity: 1; }
    80% { opacity: 0.6; }
    100% { transform: translateX(250px) translateY(120px); opacity: 0; }
  }

  /* ── Nav Bar ── */
  .site-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(2,0,8,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(100,130,180,0.1);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 50px;
    transition: transform 0.3s ease;
  }
  .site-nav-logo {
    font-family: 'Cinzel Decorative', serif;
    font-size: 16px;
    color: #f4f0ff;
    letter-spacing: 2px;
    flex-shrink: 0;
  }
  .site-nav-links {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .site-nav-links::-webkit-scrollbar { display: none; }
  .site-nav-link {
    font-family: 'Italiana', serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(180,200,240,0.4);
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.3s ease;
    background: none;
    border: none;
    padding: 0;
  }
  .site-nav-link:hover { color: rgba(200,160,220,0.7); }
  @media (max-width: 600px) {
    .site-nav { padding: 0 16px; }
    .site-nav-links { gap: 14px; }
    .site-nav-link { font-size: 11px; letter-spacing: 2px; }
  }

  /* ── Section Description ── */
  .section-desc {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: rgba(180,200,240,0.2);
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* ── Landing Page ── */
  .landing {
    min-height: 100vh;
    position: relative;
    z-index: 1;
    background: #020008;
  }

  .hero {
    padding: 110px 40px 20px;
    text-align: center;
    position: relative;
    z-index: 2;
  }
  .hero-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 28px;
    animation: fadeIn 1s ease 0.2s both;
  }
  .hero-line::before,
  .hero-line::after {
    content: '';
    width: 30px;
    height: 1px;
    border-radius: 1px;
  }
  .hero-line::before {
    background: linear-gradient(90deg, transparent, rgba(180,200,240,0.4));
  }
  .hero-line::after {
    background: linear-gradient(90deg, rgba(180,200,240,0.4), transparent);
  }
  .hero-line-text {
    font-family: 'Italiana', serif;
    font-size: 16px;
    letter-spacing: 10px;
    color: rgba(180,200,240,0.4);
    text-transform: uppercase;
  }
  .hero h1 {
    font-family: 'Cinzel Decorative', 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(48px, 8vw, 72px);
    letter-spacing: 3px;
    text-transform: none;
    color: #f4f0ff;
    animation: fadeUp 0.8s ease 0.3s both, gentlePulse 6s ease-in-out infinite;
  }
  .hero h1 span {
    display: none;
  }
  .hero-shimmer {
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    animation: fadeUp 0.8s ease 0.5s both;
  }
  .hero-shimmer::before,
  .hero-shimmer::after {
    content: '';
    width: 40px;
    height: 1px;
  }
  .hero-shimmer::before {
    background: linear-gradient(90deg, transparent, rgba(200,170,220,0.3));
  }
  .hero-shimmer::after {
    background: linear-gradient(90deg, rgba(200,170,220,0.3), transparent);
  }
  .hero-shimmer-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 24px;
    letter-spacing: 5px;
    background: linear-gradient(90deg, #8aacd0, #c8a0d8, #e0a0b8, #c8a0d8, #8aacd0);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 8s linear infinite;
  }
  .hero-sub {
    font-size: 20px;
    letter-spacing: 4px;
    text-transform: lowercase;
    font-style: italic;
    color: rgba(180,200,240,0.35);
    margin-top: 20px;
    animation: fadeUp 0.8s ease 0.6s both;
    font-family: 'Cormorant Garamond', serif;
  }
  .hero-moon {
    width: 36px;
    height: 36px;
    margin: 24px auto 0;
    opacity: 0.15;
    animation: fadeIn 1.5s ease 0.8s both;
  }

  .section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px;
    scroll-margin-top: 60px;
  }
  @media (max-width: 600px) { .section { padding: 0 16px; } }

  .section-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 48px;
    margin-bottom: 8px;
    animation: fadeUp 0.6s ease both;
  }
  .section-header + .section-desc + .char-grid,
  .section-header + .char-grid {
    margin-top: 20px;
  }
  .section-header::before,
  .section-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .section-header::before {
    max-width: 80px;
    background: linear-gradient(90deg, transparent, var(--border));
  }
  .section-header::after {
    background: linear-gradient(90deg, var(--border), transparent);
  }
  .section-title {
    font-family: 'Italiana', serif;
    font-weight: 400;
    font-style: normal;
    font-size: clamp(18px, 3vw, 24px);
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(180,200,240,0.5);
    white-space: nowrap;
  }

  .char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 22px;
    margin-bottom: 20px;
  }
  @media (max-width: 600px) {
    .char-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  }

  .char-card {
    animation: fadeUp 0.6s ease both;
    cursor: pointer;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border);
    transition: border-color 0.4s ease, transform 0.35s ease, box-shadow 0.4s ease;
  }
  .char-card:hover {
    border-color: var(--accent);
    transform: translateY(-6px);
    box-shadow: 0 16px 48px rgba(100,50,150,0.25), 0 0 0 1px var(--accent-glow), 0 0 30px rgba(200,160,220,0.08);
  }
  .char-card-img-wrap {
    overflow: hidden;
    position: relative;
  }
  .char-card-img-wrap::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to top, var(--bg-card), transparent);
    pointer-events: none;
  }
  .char-card-img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    filter: saturate(0.85);
    transition: filter 0.4s ease, transform 0.6s ease;
  }
  .char-card:hover .char-card-img {
    filter: saturate(1);
    transform: scale(1.04);
  }

  .char-card-placeholder {
    width: 100%;
    aspect-ratio: 3 / 4;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #1a1921, #0f0e14);
    position: relative;
  }
  .char-card-placeholder .initial {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    font-weight: 300;
    color: var(--border-hover);
    transition: color 0.4s ease;
  }
  .char-card:hover .char-card-placeholder .initial { color: var(--accent); }
  .char-card-placeholder .placeholder-label {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-faint);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .char-card-info { padding: 16px 18px 20px; position: relative; }
  .char-card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 500;
    font-style: italic;
    letter-spacing: 2px;
    transition: color 0.3s ease;
  }
  .char-card:hover .char-card-name { color: var(--accent); }
  .char-card-count {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-top: 4px;
  }
  .char-card-spicy {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--spicy);
    border: 1px solid var(--spicy-glow);
    background: rgba(212,92,138,0.08);
    padding: 3px 8px;
    border-radius: 20px;
    margin-top: 8px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .char-card:hover .char-card-spicy {
    background: rgba(212,92,138,0.15);
    border-color: var(--spicy);
  }
  .char-card-arrow {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%) translateX(-6px);
    color: var(--text-faint);
    font-size: 18px;
    transition: transform 0.3s ease, color 0.3s ease;
  }
  .char-card:hover .char-card-arrow {
    transform: translateY(-50%) translateX(0);
    color: var(--accent);
  }

  /* ── Gallery Page ── */
  .gallery-page {
    display: none;
    min-height: 100vh;
    animation: fadeIn 0.4s ease;
  }
  .gallery-page.active { display: block; }

  .gallery-header {
    padding: 40px 40px 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
    animation: slideIn 0.5s ease;
  }
  @media (max-width: 600px) {
    .gallery-header { padding: 24px 16px 20px; gap: 16px; }
  }
  .back-btn {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Quicksand', sans-serif;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.3s, color 0.3s;
    letter-spacing: 1px;
    flex-shrink: 0;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .gallery-title {
    font-family: 'Cinzel Decorative', 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(24px, 4vw, 40px);
    letter-spacing: 4px;
    text-transform: none;
    color: var(--accent);
  }
  .gallery-group {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .gallery-count {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .gallery-divider {
    height: 1px;
    background: linear-gradient(90deg, var(--accent), var(--border) 50%, transparent);
    margin: 0 40px;
    max-width: 1120px;
  }
  @media (max-width: 600px) { .gallery-divider { margin: 0 16px; } }

  .gallery-grid {
    columns: 3;
    column-gap: 14px;
    padding: 32px 40px 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 900px) { .gallery-grid { columns: 2; } }
  @media (max-width: 600px) { .gallery-grid { columns: 2; column-gap: 10px; padding: 20px 16px 10px; } }
  @media (max-width: 400px) { .gallery-grid { columns: 1; max-width: 360px; } }

  .gallery-item {
    break-inside: avoid;
    margin-bottom: 14px;
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.3s ease, border-color 0.3s ease;
    animation: fadeUp 0.5s ease both;
    position: relative;
  }
  .gallery-item:hover {
    transform: translateY(-3px);
    border-color: var(--border-hover);
  }
  .gallery-item:hover .item-overlay { opacity: 1; }
  .gallery-item img {
    display: block;
    width: 100%;
    height: auto;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .gallery-item img.loaded { opacity: 1; }
  .gallery-item video {
    display: block;
    width: 100%;
    height: auto;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .gallery-item video.loaded { opacity: 1; }
  .gallery-video-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    pointer-events: none;
    backdrop-filter: blur(4px);
  }
  .item-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px 12px 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .item-caption {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .gallery-empty {
    text-align: center;
    padding: 100px 40px;
    animation: fadeUp 0.5s ease;
  }
  .gallery-empty-icon {
    font-size: 48px;
    color: var(--text-faint);
    margin-bottom: 20px;
  }
  .gallery-empty p {
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* ── Spicy Divider inside gallery ── */
  .spicy-divider {
    max-width: 1120px;
    margin: 20px auto 0;
    padding: 0 40px;
    animation: fadeUp 0.5s ease both;
  }
  @media (max-width: 600px) { .spicy-divider { padding: 0 16px; } }

  .spicy-divider-inner {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 24px 0;
  }
  .spicy-divider-inner::before,
  .spicy-divider-inner::after {
    content: '';
    flex: 1;
    height: 1px;
  }
  .spicy-divider-inner::before {
    max-width: 40px;
    background: linear-gradient(90deg, transparent, var(--spicy));
  }
  .spicy-divider-inner::after {
    background: linear-gradient(90deg, var(--spicy), transparent);
  }

  .spicy-unlock-btn {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--spicy);
    cursor: pointer;
    background: none;
    border: 1px solid var(--spicy-glow);
    padding: 10px 24px;
    border-radius: 4px;
    transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    white-space: nowrap;
  }
  .spicy-unlock-btn:hover {
    background: var(--spicy-glow);
    border-color: var(--spicy);
    box-shadow: 0 0 20px var(--spicy-glow);
  }

  .spicy-gallery-grid {
    columns: 3;
    column-gap: 14px;
    padding: 20px 40px 80px;
    max-width: 1200px;
    margin: 0 auto;
    animation: fadeUp 0.4s ease both;
  }
  @media (max-width: 900px) { .spicy-gallery-grid { columns: 2; } }
  @media (max-width: 600px) { .spicy-gallery-grid { columns: 2; column-gap: 10px; padding: 16px 16px 60px; } }
  @media (max-width: 400px) { .spicy-gallery-grid { columns: 1; max-width: 360px; } }

  /* ── Age Gate Modal ── */
  .age-gate {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(5,5,8,0.97);
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
  }
  .age-gate.open { display: flex; }

  .age-gate-box {
    background: var(--bg-raised);
    border: 1px solid var(--spicy);
    border-radius: 12px;
    padding: 48px 40px;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 0 60px var(--spicy-glow);
  }
  .age-gate-box h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--spicy);
    letter-spacing: 4px;
    margin-bottom: 16px;
  }
  .age-gate-box p {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .age-gate-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
  }
  .age-gate-btn {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 12px 32px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
  }
  .age-gate-enter {
    background: var(--spicy);
    border: 1px solid var(--spicy);
    color: white;
  }
  .age-gate-enter:hover {
    background: #d44a4a;
    box-shadow: 0 0 24px var(--spicy-glow);
  }
  .age-gate-leave {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .age-gate-leave:hover {
    border-color: var(--text-dim);
    color: var(--text);
  }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(5,5,8,0.95);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .lightbox.open { display: flex; animation: fadeIn 0.25s ease; }
  .lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .lb-btn {
    position: absolute;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.2s;
    font-family: 'Libre Franklin', sans-serif;
  }

const sectionsEl = document.getElementById('sections');
const navLinksEl = document.getElementById('navLinks');

GROUPS.forEach((group, gi) => {
  const section = document.createElement('div');
  section.className = 'section';
  section.id = 'section-' + gi;

  // Nav link
  const navLink = document.createElement('button');
  navLink.className = 'site-nav-link';
  navLink.textContent = group.title;
  navLink.onclick = () => document.getElementById('section-' + gi).scrollIntoView({ behavior: 'smooth', block: 'start' });
  navLinksEl.appendChild(navLink);

  const header = document.createElement('div');
  header.className = 'section-header';
  header.innerHTML = `<span class="section-title">${group.title}</span>`;
  section.appendChild(header);

  if (group.desc) {
    const desc = document.createElement('div');
    desc.className = 'section-desc';
    desc.textContent = group.desc;
    section.appendChild(desc);
  }

  const grid = document.createElement('div');
  grid.className = 'char-grid';

  // If this group has a dedicated page, show a banner link instead
  if (group.dedicatedPage) {
    const banner = document.createElement('div');
    banner.className = 'group-banner';
    banner.onclick = () => { window.location.href = group.dedicatedPage; };
    banner.style.gridColumn = '1 / -1';

    const covers = group.characters.slice(0, 4).map(c => c.cover).filter(Boolean);
    const coversHTML = covers.map(c => `<img src="${c}" alt="" onload="this.style.opacity=1" style="opacity:0;transition:opacity 0.5s">`).join('');
    const totalImages = group.characters.reduce((s, c) => s + c.images.length + (c.spicy ? c.spicy.length : 0), 0);
    const memberNames = group.characters.map(c => c.name).join(' · ');

    banner.innerHTML = `
      <div class="group-banner-inner">
        <div class="group-banner-covers">${coversHTML}</div>
        <div class="group-banner-info">
          <div class="group-banner-name">${group.title}</div>
          <div class="group-banner-desc">${memberNames}</div>
          <div class="group-banner-count">${group.characters.length} members · ${totalImages} images</div>
          <div class="group-banner-cta">Enter their world &rarr;</div>
          <div class="group-banner-arrow">&rarr;</div>
        </div>
      </div>`;
    grid.appendChild(banner);
  } else {
    group.characters.forEach((char, i) => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.style.animationDelay = `${i * 0.08}s`;

    let imgHTML;

      imgHTML = `<div class="char-card-img-wrap">

    } else {

// ── Gallery ──

const landing        = document.getElementById('landing');
const galleryPage    = document.getElementById('galleryPage');
const galleryGroup   = document.getElementById('galleryGroup');
const galleryTitle   = document.getElementById('galleryTitle');
const galleryCount   = document.getElementById('galleryCount');
const galleryContent = document.getElementById('galleryContent');
const ageGate        = document.getElementById('ageGate');

let lbImages = [];
let lbIndex  = 0;
let pendingSpicyChar = null;
let ageVerified = false;

function openGallery(groupName, char) {
  galleryGroup.textContent = groupName;
  galleryTitle.textContent = char.name;
  const total = char.images.length + (char.spicy ? char.spicy.length : 0);
  galleryCount.textContent = total + ' image' + (total !== 1 ? 's' : '');

  galleryContent.innerHTML = '';

  if (char.images.length === 0 && (!char.spicy || char.spicy.length === 0)) {
    galleryContent.innerHTML = `
      <div class="gallery-empty">
        <div class="gallery-empty-icon">&#9744;</div>
        <p>No images yet</p>
      </div>`;
  } else {
    // Featured video
    if (char.featuredVideo) {
      const fv = document.createElement('div');
      fv.className = 'featured-video';
      fv.innerHTML = `
        <div class="featured-label">✦ featured ✦</div>
        <div class="featured-video-wrap">
          <iframe src="https://www.youtube.com/embed/${char.featuredVideo.id}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="featured-title">${char.featuredVideo.caption}</div>`;
      galleryContent.appendChild(fv);
    }

    // Main images
    if (char.images.length > 0) {
      const grid = document.createElement('div');
      grid.className = 'gallery-grid';
      char.images.forEach((img, j) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.style.animationDelay = `${j * 0.06}s`;
        item.onclick = () => { lbImages = char.images; openLightbox(j); };
        if (img.type === 'youtube') {
          item.innerHTML = `
            <img src="https://img.youtube.com/vi/${img.src}/maxresdefault.jpg" alt="${img.caption || ''}"
                 onload="this.classList.add('loaded')">
            <div class="gallery-video-badge">▶</div>
            ${img.caption ? `<div class="item-overlay"><div class="item-caption">${img.caption}</div></div>` : ''}`;
        } else if (img.type === 'video') {
          item.innerHTML = `
            <video src="${img.src}" muted loop playsinline
                   onloadeddata="this.classList.add('loaded')"
                   onmouseenter="this.play()" onmouseleave="this.pause();this.currentTime=0;"></video>
            <div class="gallery-video-badge">▶</div>
            ${img.caption ? `<div class="item-overlay"><div class="item-caption">${img.caption}</div></div>` : ''}`;
        } else {
          item.innerHTML = `
            <img src="${img.src}" alt="${img.caption || ''}"
                 onload="this.classList.add('loaded')">
            ${img.caption ? `<div class="item-overlay"><div class="item-caption">${img.caption}</div></div>` : ''}`;
        }
        grid.appendChild(item);
      });
      galleryContent.appendChild(grid);
    }

    // Spicy section
    if (char.spicy && char.spicy.length > 0) {
      const divider = document.createElement('div');
      divider.className = 'spicy-divider';

      const divInner = document.createElement('div');
      divInner.className = 'spicy-divider-inner';

      const btn = document.createElement('button');
      btn.className = 'spicy-unlock-btn';
      btn.textContent = 'Spicy Gens';
      btn.onclick = () => {
        if (ageVerified) {
          showSpicyImages(char, divider);
        } else {
          pendingSpicyChar = { char, divider };
          ageGate.classList.add('open');
        }
      };

      divInner.appendChild(btn);
      divider.appendChild(divInner);
      galleryContent.appendChild(divider);

      // Container for spicy images (hidden until unlocked)
      const spicyContainer = document.createElement('div');
      spicyContainer.id = 'spicyContainer';
      galleryContent.appendChild(spicyContainer);
    }
  }

  landing.style.display = 'none';
  document.getElementById('siteNav').style.display = 'none';
  galleryPage.classList.add('active');
  window.scrollTo(0, 0);
}

function showSpicyImages(char, dividerEl) {
  // Replace button with just the label
  const divInner = dividerEl.querySelector('.spicy-divider-inner');
  divInner.innerHTML = `<span class="section-title" style="color: var(--spicy); font-size: 18px; letter-spacing: 4px;">Spicy Gens</span>`;

  const container = document.getElementById('spicyContainer');
  container.innerHTML = '';

  const grid = document.createElement('div');
  grid.className = 'spicy-gallery-grid';
  char.spicy.forEach((img, j) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.style.animationDelay = `${j * 0.06}s`;
    item.onclick = () => { lbImages = char.spicy; openLightbox(j); };
    item.innerHTML = `
      <img src="${img.src}" alt="${img.caption || ''}"
           onload="this.classList.add('loaded')">
      ${img.caption ? `<div class="item-overlay"><div class="item-caption" style="color: var(--spicy);">${img.caption}</div></div>` : ''}`;
    grid.appendChild(item);
  });
  container.appendChild(grid);
}

function confirmAge() {
  ageVerified = true;
  ageGate.classList.remove('open');
  if (pendingSpicyChar) {
    showSpicyImages(pendingSpicyChar.char, pendingSpicyChar.divider);
    pendingSpicyChar = null;
  }
}

function closeAgeGate() {
  ageGate.classList.remove('open');
  pendingSpicyChar = null;
}

function goHome() {
  galleryPage.classList.remove('active');
  landing.style.display = '';
  document.getElementById('siteNav').style.display = '';
  window.scrollTo(0, 0);
}

// ── Lightbox ──

const lightbox  = document.getElementById('lightbox');
const lbImg     = document.getElementById('lbImg');
const lbVid     = document.getElementById('lbVid');
const lbYt      = document.getElementById('lbYt');
const lbCaption = document.getElementById('lbCaption');

function hideAllLbMedia() {
  lbImg.style.display = 'none';
  lbVid.pause(); lbVid.src = ''; lbVid.style.display = 'none';
  lbYt.src = ''; lbYt.style.display = 'none';
}

function openLightbox(i) {
  lbIndex = i;
  updateLightbox();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  hideAllLbMedia();
}
function lbNav(dir) {
  event.stopPropagation();
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  updateLightbox();
}
function updateLightbox() {
  hideAllLbMedia();
  const item = lbImages[lbIndex];
  if (item.type === 'youtube') {
    lbYt.style.display = 'block';
    lbYt.src = `https://www.youtube.com/embed/${item.src}?autoplay=1`;
  } else if (item.type === 'video') {
    lbVid.style.display = 'block';
    lbVid.src = item.src;
    lbVid.play();
  } else {
    lbImg.style.display = '';
    lbImg.src = item.src;
  }
  lbCaption.textContent = item.caption || '';
}

lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape')    closeLightbox();
  if (e.key === 'ArrowLeft')  lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});

// ── Magical Star Canvas ──

const starCanvas = document.getElementById('starCanvas');
const starCtx = starCanvas.getContext('2d');

function resizeCanvas() {
  starCanvas.width = window.innerWidth * 2;
  starCanvas.height = window.innerHeight * 2;
  starCanvas.style.width = window.innerWidth + 'px';
  starCanvas.style.height = window.innerHeight + 'px';
  starCtx.setTransform(2, 0, 0, 2, 0, 0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const starColors = [
  [255,255,255],
  [200,210,255],
  [180,200,255],
  [220,180,240],
  [255,200,220],
  [200,220,255],
  [240,210,255],
  [255,180,200],
  [170,200,240],
];

const bgStars = [];
for (let i = 0; i < 200; i++) {
  const c = starColors[Math.floor(Math.random() * starColors.length)];
  bgStars.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.2 + 0.3,
    baseAlpha: Math.random() * 0.4 + 0.1,
    twinkleSpeed: Math.random() * 0.02 + 0.005,
    twinkleOffset: Math.random() * Math.PI * 2,
    driftRange: Math.random() * 8 + 3,
    driftSpeed: Math.random() * 0.008 + 0.002,
    driftOffset: Math.random() * Math.PI * 2,
    color: c,
    glowSize: Math.random() * 4 + 1,
  });
}

const sparkles = [];
for (let i = 0; i < 15; i++) {
  sparkles.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight * 0.6,
    life: Math.random() * 200,
    maxLife: 200 + Math.random() * 150,
    size: Math.random() * 2 + 1,
    color: starColors[Math.floor(Math.random() * starColors.length)],
    speed: Math.random() * 0.3 + 0.1,
  });
}

let frame = 0;
function drawStars() {
  frame++;
  starCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  for (const s of bgStars) {
    const twinkle = Math.sin(frame * s.twinkleSpeed + s.twinkleOffset);
    const alpha = s.baseAlpha + twinkle * s.baseAlpha * 0.6;
    const drift = Math.sin(frame * s.driftSpeed + s.driftOffset);
    const dx = drift * s.driftRange * 0.3;
    const dy = drift * s.driftRange * 0.5;
    const x = s.x + dx;
    const y = s.y + dy;

    if (s.r > 0.8 && alpha > 0.3) {
      starCtx.beginPath();
      starCtx.arc(x, y, s.r + s.glowSize, 0, Math.PI * 2);
      starCtx.fillStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${alpha * 0.08})`;
      starCtx.fill();
    }

    starCtx.beginPath();
    starCtx.arc(x, y, s.r, 0, Math.PI * 2);
    starCtx.fillStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${Math.max(0, alpha)})`;
    starCtx.fill();

    if (s.r > 1 && alpha > 0.35) {
      starCtx.save();
      starCtx.globalAlpha = alpha * 0.15;
      starCtx.strokeStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},1)`;
      starCtx.lineWidth = 0.3;
      starCtx.beginPath();
      starCtx.moveTo(x - s.r * 2.5, y);
      starCtx.lineTo(x + s.r * 2.5, y);
      starCtx.stroke();
      starCtx.beginPath();
      starCtx.moveTo(x, y - s.r * 2.5);
      starCtx.lineTo(x, y + s.r * 2.5);
      starCtx.stroke();
      starCtx.restore();
    }
  }

  for (const sp of sparkles) {
    sp.life++;
    sp.y -= sp.speed;
    if (sp.life > sp.maxLife) {
      sp.life = 0;
      sp.x = Math.random() * window.innerWidth;
      sp.y = Math.random() * window.innerHeight * 0.6 + window.innerHeight * 0.1;
      sp.color = starColors[Math.floor(Math.random() * starColors.length)];
    }
    const prog = sp.life / sp.maxLife;
    const fade = prog < 0.2 ? prog / 0.2 : prog > 0.8 ? (1 - prog) / 0.2 : 1;
    starCtx.beginPath();
    starCtx.arc(sp.x, sp.y, sp.size * fade, 0, Math.PI * 2);
    starCtx.fillStyle = `rgba(${sp.color[0]},${sp.color[1]},${sp.color[2]},${fade * 0.4})`;
    starCtx.fill();
  }

  requestAnimationFrame(drawStars);
}
drawStars();

function shootStar() {
  const el = document.createElement('div');
  const startX = Math.random() * window.innerWidth * 0.6;
  const startY = Math.random() * window.innerHeight * 0.3;
  const angle = 25 + Math.random() * 20;
  const hues = [
    'rgba(200,210,255,',
    'rgba(255,200,220,',
    'rgba(220,200,255,',
  ];
  const hue = hues[Math.floor(Math.random() * hues.length)];
  el.style.cssText = `position:absolute;left:${startX}px;top:${startY}px;width:40px;height:1px;background:linear-gradient(90deg,${hue}0.6),${hue}0));border-radius:1px;transform:rotate(${angle}deg);pointer-events:none;z-index:2;animation:shootingStar ${1 + Math.random() * 0.5}s linear forwards;`;
  document.getElementById('shootingStarContainer').appendChild(el);
  setTimeout(() => el.remove(), 2000);
  setTimeout(shootStar, 4000 + Math.random() * 8000);
}
setTimeout(shootStar, 2000);
