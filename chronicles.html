<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronicles · Eurielle's Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #050302;
  --bg: #0a0805;
  --bg-card: #14100c;
  --bg-card-hover: #1c1612;
  --border: #3a2a1a;
  --border-bright: #5a3f24;
  --text: #e8dcc0;
  --text-dim: #a08960;
  --text-muted: #6b5a44;
  --gold: #c9a875;
  --gold-bright: #d4af37;
  --candle: #f4a460;
  --burgundy: #4a1a1f;
  --burgundy-deep: #2a0a0e;
  --spicy: #9b0e22;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  line-height: 1.7;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* Ambient candle-corner glows */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 600px 400px at 10% 0%, rgba(244, 164, 96, 0.05), transparent 60%),
    radial-gradient(ellipse 600px 400px at 90% 100%, rgba(212, 175, 55, 0.04), transparent 60%),
    radial-gradient(ellipse 400px 300px at 50% 50%, rgba(74, 26, 31, 0.08), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Aged parchment grain */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 25% 25%, rgba(58, 42, 26, 0.5) 1px, transparent 1.5px),
    radial-gradient(circle at 75% 75%, rgba(58, 42, 26, 0.4) 1px, transparent 1.5px);
  background-size: 120px 120px, 90px 90px;
  background-position: 0 0, 45px 45px;
  pointer-events: none;
  opacity: 0.22;
  z-index: 1;
  mix-blend-mode: overlay;
}

/* Ember particle canvas */
#emberCanvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
}

/* Back link */
.back-link {
  position: fixed;
  top: 24px;
  left: 24px;
  z-index: 100;
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 4px;
  color: var(--gold);
  text-decoration: none;
  padding: 10px 18px;
  border: 1px solid var(--border);
  background: rgba(10, 8, 5, 0.85);
  backdrop-filter: blur(4px);
  text-transform: uppercase;
  transition: color 0.3s ease, border-color 0.3s ease, letter-spacing 0.3s ease;
}
.back-link:hover {
  color: var(--candle);
  border-color: var(--gold);
  letter-spacing: 5px;
}

/* ── Hero ── */
.hero {
  position: relative;
  z-index: 3;
  padding: 160px 24px 100px;
  text-align: center;
  max-width: 1200px;
  margin: 0 auto;
}

.hero-eyebrow {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 10px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 32px;
  opacity: 0.85;
}

.hero-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(56px, 11vw, 140px);
  font-weight: 900;
  letter-spacing: 6px;
  color: var(--text);
  line-height: 1;
  margin-bottom: 36px;
  background: linear-gradient(180deg, var(--text) 0%, var(--gold) 55%, var(--burgundy) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 80px rgba(244, 164, 96, 0.15);
}

.hero-rule {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin: 36px auto 28px;
  color: var(--gold);
  font-size: 22px;
}
.hero-rule::before,
.hero-rule::after {
  content: '';
  height: 1px;
  width: 100px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.hero-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(18px, 2.2vw, 26px);
  color: var(--text-dim);
  letter-spacing: 3px;
  max-width: 700px;
  margin: 0 auto;
}

/* ── Content / Cards Grid ── */
.content {
  position: relative;
  z-index: 3;
  max-width: 1300px;
  margin: 40px auto 120px;
  padding: 0 24px;
}

.section-heading {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(26px, 3.6vw, 42px);
  text-align: center;
  letter-spacing: 6px;
  color: var(--gold);
  margin-bottom: 70px;
  text-transform: uppercase;
  font-weight: 700;
  position: relative;
}
.section-heading::after {
  content: '❦';
  display: block;
  font-size: 22px;
  color: var(--gold);
  margin-top: 18px;
  font-weight: 400;
}

.char-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 40px;
}

.char-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  position: relative;
  cursor: pointer;
  transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
  overflow: hidden;
}
/* Inner gold-leaf frame on hover */
.char-card::before {
  content: '';
  position: absolute;
  inset: 10px;
  border: 1px solid var(--gold);
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
  z-index: 3;
}
.char-card:hover {
  transform: translateY(-8px);
  border-color: var(--gold);
  box-shadow: 0 24px 70px rgba(0,0,0,0.7), 0 0 50px rgba(212, 175, 55, 0.12);
}
.char-card:hover::before { opacity: 0.4; }

.char-card-img-wrap {
  width: 100%;
  height: 440px;
  position: relative;
  overflow: hidden;
}
.char-card-img-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 35%, var(--bg-card) 95%);
  pointer-events: none;
}
.char-card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
  transition: transform 0.7s ease, filter 0.4s ease;
  filter: brightness(0.85) saturate(0.9);
}
.char-card:hover .char-card-img {
  transform: scale(1.04);
  filter: brightness(1) saturate(1);
}

.char-card-body {
  padding: 24px 26px 30px;
  position: relative;
}

.char-card-name {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(22px, 2vw, 30px);
  letter-spacing: 3px;
  color: var(--text);
  margin-bottom: 8px;
  font-weight: 700;
  transition: color 0.3s ease;
}
.char-card:hover .char-card-name { color: var(--gold); }

.char-card-desc {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 16px;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-bottom: 18px;
  min-height: 22px;
}

.char-card-count {
  font-family: 'Cinzel', serif;
  font-size: 10.5px;
  letter-spacing: 3px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 22px;
  opacity: 0.85;
}
.char-card-count .spicy-tag {
  color: var(--spicy);
  margin-left: 8px;
}

.view-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--gold);
  background: transparent;
  border: 1px solid var(--gold);
  padding: 11px 22px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease, letter-spacing 0.3s ease;
}
.view-btn::after { content: '→'; font-family: serif; }
.char-card:hover .view-btn {
  background: var(--gold);
  color: var(--ink);
  letter-spacing: 5px;
}

/* ── Gallery Overlay (full-screen) ── */
.gallery-page {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  display: none;
  overflow-y: auto;
}
.gallery-page.active { display: block; }
.gallery-page::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 600px 400px at 10% 0%, rgba(244, 164, 96, 0.05), transparent 60%),
    radial-gradient(ellipse 600px 400px at 90% 100%, rgba(212, 175, 55, 0.04), transparent 60%);
  pointer-events: none;
  z-index: 1;
}

.gallery-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(10, 8, 5, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 20px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

.gallery-close-btn {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 4px;
  color: var(--gold);
  background: transparent;
  border: 1px solid var(--border);
  padding: 10px 18px;
  cursor: pointer;
  text-transform: uppercase;
  transition: color 0.3s ease, border-color 0.3s ease;
}
.gallery-close-btn:hover { color: var(--candle); border-color: var(--gold); }

.gallery-title-wrap { text-align: center; flex: 1; min-width: 0; }
.gallery-group {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 5px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 4px;
  opacity: 0.7;
}
.gallery-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(20px, 2.4vw, 28px);
  letter-spacing: 4px;
  color: var(--text);
  text-transform: uppercase;
}
.gallery-count {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--gold);
}

.gallery-body {
  position: relative;
  z-index: 2;
  padding: 50px 32px 100px;
  max-width: 1500px;
  margin: 0 auto;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 22px;
}
.spicy-gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 22px;
}

.gallery-item {
  position: relative;
  cursor: pointer;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg-card);
  transition: border-color 0.3s ease, transform 0.3s ease;
  animation: fadeInUp 0.5s ease backwards;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.gallery-item:hover {
  border-color: var(--gold);
  transform: translateY(-2px);
}
.gallery-item img,
.gallery-item video {
  width: 100%;
  height: 360px;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.5s ease;
}
.gallery-item img.loaded,
.gallery-item video.loaded { opacity: 1; }
.gallery-item:hover img { transform: scale(1.04); }

.item-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  padding: 14px 16px;
  background: linear-gradient(to top, rgba(5,3,2,0.95) 0%, rgba(5,3,2,0.4) 40%, transparent 70%);
  pointer-events: none;
}
.item-caption {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 17px;
  color: var(--gold);
  letter-spacing: 1px;
}

.gallery-empty {
  text-align: center;
  padding: 100px 20px;
  color: var(--text-muted);
}
.gallery-empty-icon { font-size: 60px; margin-bottom: 16px; opacity: 0.4; }

/* Spicy divider + unlock */
.spicy-divider {
  margin: 60px 0 40px;
  text-align: center;
  position: relative;
}
.spicy-divider-inner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 0 24px;
  background: var(--bg);
  position: relative;
  z-index: 2;
}
.spicy-divider::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--spicy), transparent);
  z-index: 1;
}
.spicy-unlock-btn {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 5px;
  color: var(--spicy);
  background: transparent;
  border: 1px solid var(--spicy);
  padding: 12px 28px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
}
.spicy-unlock-btn:hover {
  background: var(--spicy);
  color: var(--text);
  box-shadow: 0 0 20px rgba(155, 14, 34, 0.4);
}
.section-title {
  font-family: 'Cinzel Decorative', serif;
  letter-spacing: 4px;
  text-transform: uppercase;
}

/* ── Age Gate ── */
.age-gate {
  position: fixed;
  inset: 0;
  background: rgba(5, 3, 2, 0.96);
  backdrop-filter: blur(12px);
  z-index: 400;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.age-gate.open { display: flex; }
.age-gate-box {
  background: var(--bg-card);
  border: 1px solid var(--gold);
  padding: 50px 44px;
  max-width: 460px;
  width: 100%;
  text-align: center;
  position: relative;
  box-shadow: 0 0 60px rgba(212, 175, 55, 0.15);
}
.age-gate-box::before {
  content: '❦';
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--gold);
  font-size: 18px;
}
.age-gate-box h2 {
  font-family: 'Cinzel Decorative', serif;
  font-size: 28px;
  letter-spacing: 4px;
  color: var(--spicy);
  margin-bottom: 18px;
  text-transform: uppercase;
}
.age-gate-box p {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 18px;
  color: var(--text-dim);
  line-height: 1.6;
  margin-bottom: 32px;
}
.age-gate-buttons {
  display: flex;
  gap: 14px;
  justify-content: center;
}
.age-gate-btn {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 3px;
  padding: 12px 24px;
  background: transparent;
  border: 1px solid;
  cursor: pointer;
  text-transform: uppercase;
  transition: background 0.3s ease, color 0.3s ease;
}
.age-gate-enter { color: var(--spicy); border-color: var(--spicy); }
.age-gate-enter:hover { background: var(--spicy); color: var(--text); }
.age-gate-leave { color: var(--text-dim); border-color: var(--border); }
.age-gate-leave:hover { color: var(--text); border-color: var(--gold); }

/* ── Lightbox ── */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.97);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px;
}
.lightbox.active { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
  border: 1px solid var(--border);
}
.lb-btn {
  position: fixed;
  background: rgba(10, 8, 5, 0.85);
  border: 1px solid var(--border);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 22px;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  z-index: 501;
}
.lb-btn:hover { color: var(--candle); border-color: var(--gold); background: rgba(20, 16, 12, 0.95); }
.lb-close { top: 24px; right: 24px; font-size: 28px; }
.lb-nav { top: 50%; transform: translateY(-50%); }
.lb-prev { left: 24px; }
.lb-next { right: 24px; }

/* Responsive */
@media (max-width: 900px) {
  .hero { padding: 120px 20px 60px; }
  .char-cards { grid-template-columns: 1fr; gap: 28px; }
  .char-card-img-wrap { height: 380px; }
  .gallery-header { flex-direction: column; gap: 12px; padding: 16px 20px; text-align: center; }
  .gallery-body { padding: 30px 20px 80px; }
  .gallery-item img, .gallery-item video { height: 280px; }
  .lb-btn { width: 40px; height: 40px; font-size: 18px; }
  .lb-close { top: 16px; right: 16px; }
  .lb-prev { left: 12px; }
  .lb-next { right: 12px; }
}
</style>
</head>
<body>

<a class="back-link" href="index.html">&larr; Gallery</a>

<canvas id="emberCanvas"></canvas>

<section class="hero">
  <div class="hero-eyebrow">A Bound Volume</div>
  <h1 class="hero-title">Chronicles</h1>
  <div class="hero-rule">❦</div>
  <div class="hero-sub">Of eras past, of worlds unmade</div>
</section>

<main class="content">
  <h2 class="section-heading">The Cast</h2>
  <div class="char-cards" id="charCards"></div>
</main>

<!-- ── Gallery Page (full-screen overlay) ── -->
<div class="gallery-page" id="galleryPage">
  <div class="gallery-header">
    <button class="gallery-close-btn" onclick="closeGallery()">&larr; Back</button>
    <div class="gallery-title-wrap">
      <div class="gallery-group" id="galleryGroup"></div>
      <div class="gallery-title" id="galleryTitle"></div>
    </div>
    <div class="gallery-count" id="galleryCount"></div>
  </div>
  <div class="gallery-body" id="galleryContent"></div>
</div>

<!-- ── Age Gate Modal ── -->
<div class="age-gate" id="ageGate">
  <div class="age-gate-box">
    <h2>18+ Content</h2>
    <p>This section contains mature content.<br>Are you 18 or older?</p>
    <div class="age-gate-buttons">
      <button class="age-gate-btn age-gate-enter" onclick="confirmAge()">Yes, Enter</button>
      <button class="age-gate-btn age-gate-leave" onclick="closeAgeGate()">No, Go Back</button>
    </div>
  </div>
</div>

<!-- ── Lightbox ── -->
<div class="lightbox" id="lightbox">
  <button class="lb-btn lb-close" onclick="closeLightbox()">&#215;</button>
  <button class="lb-btn lb-nav lb-prev" onclick="lbNav(-1)">&#8249;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-nav lb-next" onclick="lbNav(1)">&#8250;</button>
</div>

<script>
// ────────────────────────────────────────────────────────────
//  Character Data (mirrors index.html's Medieval/Fantasy group)
// ────────────────────────────────────────────────────────────

    {

        { src: "varro-mural.png",     caption: "The mural" },
        { src: "varro-cell.png",      caption: "The cell" },

        { src: "varro-rain.png",      caption: "In the rain" },

        { src: "varro-sp-steam.png",    caption: "Steam" },
        { src: "varro-sp-marble.png",   caption: "Marble baths" },
        { src: "varro-sp-crimson.png",  caption: "Crimson silk" },
        { src: "varro-sp-arms.png",     caption: "Arms crossed" },
        { src: "varro-sp-gold.png",     caption: "Gold & velvet" },

    {

      desc: "Of chains and dungeons",
      images: [
        { src: "samuel.png",         caption: "Bound" },

// ────────────────────────────────────────────────────────────
//  Render character cards
// ────────────────────────────────────────────────────────────
const charCards = document.getElementById('charCards');
GROUP.characters.forEach((char) => {
  const card = document.createElement('div');
  card.className = 'char-card';
  card.onclick = () => openGallery(GROUP.title, char);
  const spicyTag = char.spicy && char.spicy.length
    ? `<span class="spicy-tag">· ${char.spicy.length} spicy</span>`
    : '';
  card.innerHTML = `
    <div class="char-card-img-wrap">
      <img class="char-card-img" src="${char.cover}" alt="${char.name}" loading="lazy">
    </div>
    <div class="char-card-body">
      <div class="char-card-name">${char.name}</div>
      <div class="char-card-desc">${char.desc || ''}</div>
      <div class="char-card-count">${char.images.length} image${char.images.length !== 1 ? 's' : ''}${spicyTag}</div>
      <button class="view-btn">View Gallery</button>
    </div>
  `;
  charCards.appendChild(card);
});

// ────────────────────────────────────────────────────────────
//  Gallery overlay
// ────────────────────────────────────────────────────────────
const galleryPage    = document.getElementById('galleryPage');
const galleryGroup   = document.getElementById('galleryGroup');
const galleryTitle   = document.getElementById('galleryTitle');
const galleryCount   = document.getElementById('galleryCount');
const galleryContent = document.getElementById('galleryContent');
const ageGate        = document.getElementById('ageGate');
let ageVerified      = false;
let pendingSpicyChar = null;
let lbImages         = [];
let lbIndex          = 0;

function openGallery(groupName, char) {
  galleryGroup.textContent = groupName;
  galleryTitle.textContent = char.name;
  const total = char.images.length + (char.spicy ? char.spicy.length : 0);
  galleryCount.textContent = total + ' image' + (total !== 1 ? 's' : '');

  galleryContent.innerHTML = '';

  if (char.images.length === 0 && (!char.spicy || char.spicy.length === 0)) {
    galleryContent.innerHTML = `
      <div class="gallery-empty">
        <div class="gallery-empty-icon">❦</div>
        <p>No images yet</p>
      </div>`;
  } else {
    if (char.images.length > 0) {
      const grid = document.createElement('div');
      grid.className = 'gallery-grid';
      char.images.forEach((img, j) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.style.animationDelay = `${j * 0.05}s`;
        item.onclick = () => { lbImages = char.images; openLightbox(j); };
        item.innerHTML = `
          <img src="${img.src}" alt="${img.caption || ''}" onload="this.classList.add('loaded')">
          ${img.caption ? `<div class="item-overlay"><div class="item-caption">${img.caption}</div></div>` : ''}`;
        grid.appendChild(item);
      });
      galleryContent.appendChild(grid);
    }

    if (char.spicy && char.spicy.length > 0) {
      const divider = document.createElement('div');
      divider.className = 'spicy-divider';

      const divInner = document.createElement('div');
      divInner.className = 'spicy-divider-inner';

      const btn = document.createElement('button');
      btn.className = 'spicy-unlock-btn';
      btn.textContent = 'Spicy Gens';
      btn.onclick = () => {
        if (ageVerified) {
          showSpicyImages(char, divider);
        } else {
          pendingSpicyChar = { char, divider };
          ageGate.classList.add('open');
        }
      };

      divInner.appendChild(btn);
      divider.appendChild(divInner);
      galleryContent.appendChild(divider);

      const spicyContainer = document.createElement('div');
      spicyContainer.id = 'spicyContainer';
      galleryContent.appendChild(spicyContainer);
    }
  }

  galleryPage.classList.add('active');
  window.scrollTo(0, 0);
  document.body.style.overflow = 'hidden';
}

function closeGallery() {
  galleryPage.classList.remove('active');
  document.body.style.overflow = '';
}

function showSpicyImages(char, dividerEl) {
  const divInner = dividerEl.querySelector('.spicy-divider-inner');
  divInner.innerHTML = `<span class="section-title" style="color: var(--spicy); font-size: 18px; letter-spacing: 4px;">Spicy Gens</span>`;

  const container = document.getElementById('spicyContainer');
  container.innerHTML = '';

  const grid = document.createElement('div');
  grid.className = 'spicy-gallery-grid';
  char.spicy.forEach((img, j) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.style.animationDelay = `${j * 0.05}s`;
    item.onclick = () => { lbImages = char.spicy; openLightbox(j); };
    item.innerHTML = `
      <img src="${img.src}" alt="${img.caption || ''}" onload="this.classList.add('loaded')">
      ${img.caption ? `<div class="item-overlay"><div class="item-caption" style="color: var(--spicy);">${img.caption}</div></div>` : ''}`;
    grid.appendChild(item);
  });
  container.appendChild(grid);
}

function confirmAge() {
  ageVerified = true;
  ageGate.classList.remove('open');
  if (pendingSpicyChar) {
    showSpicyImages(pendingSpicyChar.char, pendingSpicyChar.divider);
    pendingSpicyChar = null;
  }
}
function closeAgeGate() {
  ageGate.classList.remove('open');
  pendingSpicyChar = null;
}

// ────────────────────────────────────────────────────────────
//  Lightbox
// ────────────────────────────────────────────────────────────
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lbImg');

function openLightbox(i) {
  lbIndex = i;
  lbImg.src = lbImages[i].src;
  lbImg.alt = lbImages[i].caption || '';
  lightbox.classList.add('active');
}
function closeLightbox() { lightbox.classList.remove('active'); }
function lbNav(dir) {
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  lbImg.src = lbImages[lbIndex].src;
  lbImg.alt = lbImages[lbIndex].caption || '';
}

// Keyboard navigation in lightbox
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'Escape')    closeLightbox();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});
// ESC closes the gallery page too
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (lightbox.classList.contains('active')) return; // handled above
  if (ageGate.classList.contains('open')) { closeAgeGate(); return; }
  if (galleryPage.classList.contains('active')) closeGallery();
});

// ────────────────────────────────────────────────────────────
//  Ember/dust particles drifting up
// ────────────────────────────────────────────────────────────
const canvas = document.getElementById('emberCanvas');
const ctx    = canvas.getContext('2d');
let embers   = [];

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function spawnEmber() {
  const palette = ['244,164,96', '212,175,55', '201,168,117'];
  embers.push({
    x: Math.random() * canvas.width,
    y: canvas.height + 10,
    vx: (Math.random() - 0.5) * 0.35,
    vy: -0.25 - Math.random() * 0.75,
    size: 0.8 + Math.random() * 1.6,
    opacity: 0.15 + Math.random() * 0.45,
    maxOpacity: 0.6,
    fadeRate: 0.0015 + Math.random() * 0.001,
    color: palette[Math.floor(Math.random() * palette.length)],
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.01 + Math.random() * 0.02,
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (Math.random() < 0.5 && embers.length < 75) spawnEmber();

  embers.forEach(e => {
    e.wobble += e.wobbleSpeed;
    e.x      += e.vx + Math.sin(e.wobble) * 0.15;
    e.y      += e.vy;
    e.opacity -= e.fadeRate;

    ctx.fillStyle = `rgba(${e.color}, ${e.opacity})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    ctx.fill();

    // Soft glow halo
    ctx.fillStyle = `rgba(${e.color}, ${e.opacity * 0.18})`;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size * 3, 0, Math.PI * 2);
    ctx.fill();
  });

  embers = embers.filter(e => e.opacity > 0 && e.y > -20);
  requestAnimationFrame(animate);
}
animate();
</script>
