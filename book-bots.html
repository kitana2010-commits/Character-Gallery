<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Other Book Bots · Eurielle's Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #050810;
  --bg: #0a1124;
  --bg-card: #14192e;
  --bg-card-hover: #1d2444;
  --border: #2a304d;
  --border-bright: #424a72;
  --text: #ece2cd;
  --text-dim: #b4a98d;
  --text-muted: #6a6450;
  --cream: #e8dcc4;
  --cream-bright: #f4e9d2;
  --gold: #c8a45a;
  --gold-bright: #e2c280;
  --ink-blue: #1a2247;
  --crimson: #8a2540;
  --spicy: #b03050;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'EB Garamond', serif;
  font-size: 18px;
  line-height: 1.7;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* Ambient: warm reading-lamp pools at the edges */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 900px 600px at 50% -10%, rgba(200, 164, 90, 0.08), transparent 60%),
    radial-gradient(ellipse 500px 400px at 8% 100%, rgba(232, 220, 196, 0.04), transparent 60%),
    radial-gradient(ellipse 600px 500px at 95% 85%, rgba(200, 164, 90, 0.05), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* Subtle paper-grain texture */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><g fill='none' stroke='%23c8a45a' stroke-width='0.4' opacity='0.06'><path d='M 0 90 L 180 90'/><path d='M 90 0 L 90 180'/><circle cx='90' cy='90' r='1.5' fill='%23c8a45a' stroke='none' opacity='0.5'/></g></svg>");
  background-size: 180px 180px;
  pointer-events: none;
  opacity: 0.6;
  z-index: 1;
}

/* Drifting paper scraps */
#scrapsCanvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: 0.85;
}

/* Back link */
.back-link {
  position: fixed;
  top: 24px;
  left: 24px;
  z-index: 50;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--text-dim);
  text-transform: uppercase;
  text-decoration: none;
  padding: 10px 18px;
  border: 1px solid var(--border);
  background: rgba(10, 17, 36, 0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-weight: 600;
  transition: color 0.25s, border-color 0.25s;
}
.back-link:hover {
  color: var(--gold-bright);
  border-color: var(--gold);
}

/* ─── Hero ─── */
.hero {
  position: relative;
  z-index: 3;
  padding: 170px 24px 100px;
  text-align: center;
  max-width: 1200px;
  margin: 0 auto;
}
.hero-emblem {
  position: absolute;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  width: min(440px, 85vw);
  height: auto;
  opacity: 0.10;
  pointer-events: none;
  color: var(--gold);
  z-index: -1;
}
.hero-eyebrow {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 9px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 30px;
  font-weight: 500;
  opacity: 0.95;
}
.hero-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(42px, 7.5vw, 88px);
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--text);
  line-height: 1.05;
  margin-bottom: 36px;
  background: linear-gradient(180deg, var(--cream-bright) 0%, var(--cream) 50%, var(--gold) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 80px rgba(200, 164, 90, 0.18);
}
.hero-rule {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  margin: 36px auto 28px;
}
.hero-rule .rule-line {
  height: 1px;
  width: 130px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.hero-rule .ornament {
  color: var(--gold);
  font-size: 18px;
  text-shadow: 0 0 12px rgba(200, 164, 90, 0.5);
}
.hero-sub {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: clamp(17px, 2vw, 24px);
  color: var(--text-dim);
  letter-spacing: 3px;
  max-width: 700px;
  margin: 0 auto;
}

/* ─── Content ─── */
.content {
  position: relative;
  z-index: 3;
  max-width: 1300px;
  margin: 0 auto;
  padding: 40px 24px 120px;
}
.section-heading {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(24px, 3.4vw, 38px);
  text-align: center;
  letter-spacing: 6px;
  color: var(--cream);
  margin-bottom: 70px;
  text-transform: uppercase;
  font-weight: 700;
}
.section-heading::after {
  content: '❦';
  display: block;
  font-size: 24px;
  color: var(--gold);
  margin-top: 14px;
  font-weight: 400;
  line-height: 1;
  text-shadow: 0 0 14px rgba(200, 164, 90, 0.5);
}

/* ─── Character Cards ─── */
.char-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 40px;
}

.char-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  position: relative;
  cursor: pointer;
  transition: transform 0.4s, border-color 0.4s, box-shadow 0.4s;
  overflow: hidden;
}
.char-card::before {
  content: '';
  position: absolute;
  inset: 10px;
  border: 1px solid var(--gold);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
  z-index: 3;
}
/* Corner decorations — small ❦ flourishes */
.char-card .corner {
  position: absolute;
  width: 20px;
  height: 20px;
  pointer-events: none;
  z-index: 4;
  color: var(--gold);
  opacity: 0.5;
  transition: opacity 0.4s, color 0.4s;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.char-card .corner.tl { top: 8px; left: 8px; }
.char-card .corner.tr { top: 8px; right: 8px; }
.char-card .corner.bl { bottom: 8px; left: 8px; }
.char-card .corner.br { bottom: 8px; right: 8px; }
.char-card:hover .corner { opacity: 1; color: var(--gold-bright); text-shadow: 0 0 8px rgba(226, 194, 128, 0.6); }
.char-card:hover {
  transform: translateY(-8px);
  border-color: var(--gold);
  box-shadow: 0 24px 70px rgba(0,0,0,0.7), 0 0 50px rgba(200, 164, 90, 0.12);
}
.char-card:hover::before { opacity: 0.45; }

.char-card-img-wrap {
  width: 100%;
  height: 440px;
  position: relative;
  overflow: hidden;
  background: var(--ink);
}
.char-card-img-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 55%, var(--bg-card) 100%);
  pointer-events: none;
}
.char-card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s;
}
.char-card:hover .char-card-img { transform: scale(1.04); }
.char-card-body {
  padding: 22px 24px 28px;
  position: relative;
  z-index: 2;
}
.char-card-name {
  font-family: 'Cinzel Decorative', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
  line-height: 1.2;
}
.char-card-desc {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-bottom: 14px;
}
.char-card-count {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 20px;
  font-weight: 500;
}
.spicy-tag {
  color: var(--spicy);
  margin-left: 6px;
  font-weight: 600;
}
.view-btn {
  background: transparent;
  border: 1px solid var(--border-bright);
  color: var(--text);
  padding: 11px 22px;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.25s, color 0.25s, border-color 0.25s;
  font-weight: 600;
}
.view-btn:hover {
  background: var(--gold);
  color: var(--ink);
  border-color: var(--gold);
}

/* ─── Gallery Overlay ─── */
.gallery-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 8, 16, 0.97);
  z-index: 100;
  display: none;
  flex-direction: column;
  overflow-y: auto;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.gallery-overlay.open { display: flex; }
.gallery-overlay-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 26px 40px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(5, 8, 16, 0.92);
  backdrop-filter: blur(14px);
  z-index: 5;
  gap: 20px;
}
.gallery-close-btn {
  background: transparent;
  border: 1px solid var(--border-bright);
  color: var(--text);
  padding: 10px 18px;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
  font-weight: 600;
  flex-shrink: 0;
}
.gallery-close-btn:hover {
  color: var(--gold-bright);
  border-color: var(--gold);
}
.gallery-overlay-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
  text-align: center;
}
.gallery-overlay-count {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--text-muted);
  text-transform: uppercase;
  flex-shrink: 0;
  text-align: right;
  min-width: 88px;
}
.gallery-body {
  padding: 50px 40px 80px;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}
.gallery-section-title {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 28px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 14px;
}
.gallery-section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Featured video block (for characters with featuredVideo) */
.featured-video {
  margin-bottom: 60px;
}
.featured-video-frame {
  position: relative;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  aspect-ratio: 16 / 9;
  border: 1px solid var(--gold);
  overflow: hidden;
  background: var(--ink);
  box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 40px rgba(200, 164, 90, 0.1);
}
.featured-video-frame iframe {
  width: 100%;
  height: 100%;
  border: 0;
}
.featured-video-caption {
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--gold-bright);
  font-size: 16px;
  letter-spacing: 2px;
  margin-top: 14px;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 60px;
}
.gallery-item {
  position: relative;
  cursor: pointer;
  background: var(--bg-card);
  overflow: hidden;
}
.gallery-item img, .gallery-item video {
  width: 100%;
  height: 340px;
  object-fit: cover;
  display: block;
  transition: transform 0.4s;
}
.gallery-item:hover img, .gallery-item:hover video { transform: scale(1.04); }
.gallery-caption {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.88));
  padding: 36px 16px 14px;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 2.5px;
  color: var(--text);
  text-transform: uppercase;
  font-weight: 500;
}

.spicy-divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 50px 0 30px;
}
.spicy-divider .line { flex: 1; height: 1px; background: var(--crimson); }
.section-title {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: 600;
}

/* ─── Lightbox ─── */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.96);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 60px 40px;
}
.lightbox.open { display: flex; }
.lightbox img, .lightbox video {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.lb-btn {
  position: absolute;
  background: rgba(20, 25, 46, 0.85);
  border: 1px solid var(--border-bright);
  color: var(--text);
  width: 48px;
  height: 48px;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  backdrop-filter: blur(8px);
}
.lb-btn:hover {
  background: var(--gold);
  color: var(--ink);
  border-color: var(--gold);
}
.lb-close { top: 24px; right: 24px; }
.lb-prev { left: 24px; top: 50%; transform: translateY(-50%); }
.lb-next { right: 24px; top: 50%; transform: translateY(-50%); }

/* ─── Age Gate ─── */
.agegate {
  position: fixed;
  inset: 0;
  background: rgba(5, 8, 16, 0.97);
  backdrop-filter: blur(16px);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.agegate.open { display: flex; }
.agegate-box {
  max-width: 460px;
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--crimson);
  padding: 40px 36px;
  text-align: center;
}
.agegate-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--spicy);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 22px;
}
.agegate-text {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 15px;
  color: var(--text-dim);
  line-height: 1.65;
  margin-bottom: 28px;
}
.agegate-buttons { display: flex; gap: 12px; }
.agegate-btn {
  flex: 1;
  padding: 14px 18px;
  background: transparent;
  border: 1px solid var(--border-bright);
  color: var(--text);
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  font-weight: 600;
}
.agegate-btn:hover { border-color: var(--text); }
.agegate-btn.confirm { background: var(--crimson); border-color: var(--crimson); color: white; }
.agegate-btn.confirm:hover { background: var(--spicy); border-color: var(--spicy); }

.footer {
  text-align: center;
  padding: 40px 24px 60px;
  color: var(--text-muted);
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  position: relative;
  z-index: 3;
  font-weight: 500;
}

@media (max-width: 768px) {
  .hero { padding: 130px 20px 80px; }
  .back-link { top: 14px; left: 14px; padding: 8px 14px; font-size: 10px; }
  .gallery-overlay-header { padding: 18px 20px; }
  .gallery-overlay-title { font-size: 18px; }
  .gallery-overlay-count { display: none; }
  .gallery-body { padding: 30px 20px 80px; }
  .gallery-item img, .gallery-item video { height: 280px; }
  .lb-btn { width: 40px; height: 40px; font-size: 16px; }
  .lb-close { top: 16px; right: 16px; }
  .lb-prev { left: 12px; }
  .lb-next { right: 12px; }
  .lightbox { padding: 40px 16px; }
  .char-card-img-wrap { height: 380px; }
}
</style>

</head>

<a class="back-link" href="index.html">← Gallery</a>
<canvas id="scrapsCanvas"></canvas>

<section class="hero">

</section>

<main class="content">

</main>

<div class="gallery-overlay" id="galleryOverlay">
  <div class="gallery-overlay-header">

<div class="lightbox" id="lightbox">

  <div id="lightboxContent"></div>
</div>

<div class="agegate" id="agegate">
  <div class="agegate-box">

</div>

<div class="footer">❦ Eurielle's Gallery · Other Book Bots ❦</div>

<script>
// ────────────────────────────────────────────────────────────
//  Character Data
// ────────────────────────────────────────────────────────────
const GROUP = {
  title: "Other Book Bots",
  characters: [
    {
      name: "Andy",
      cover: "andy-mask.png",
      featuredVideo: { id: "-WI6_crQriU", caption: "Andy" },
      images: [

// Gallery overlay
const galleryOverlay = document.getElementById('galleryOverlay');
const overlayTitle   = document.getElementById('overlayTitle');
const overlayCount   = document.getElementById('overlayCount');
const galleryContent = document.getElementById('galleryContent');
let currentChar = null;
let currentList = [];
let lightboxIdx = 0;

function openGallery(groupTitle, char) {
  currentChar = char;
  overlayTitle.textContent = char.name;
  const total = char.images.length + (char.spicy ? char.spicy.length : 0);
  overlayCount.textContent = total + ' total';
  galleryContent.innerHTML = '';

  if (char.featuredVideo) {
    const fv = document.createElement('div');
    fv.className = 'featured-video';
    fv.innerHTML = `
      <div class="gallery-section-title">Featured</div>
      <div class="featured-video-frame">
        <iframe src="https://www.youtube.com/embed/${char.featuredVideo.id}"
                title="${char.featuredVideo.caption}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
      </div>
      ${char.featuredVideo.caption ? `<div class="featured-video-caption">${char.featuredVideo.caption}</div>` : ''}
    `;
    galleryContent.appendChild(fv);
  }

  if (char.images && char.images.length) {
    const title = document.createElement('div');
    title.className = 'gallery-section-title';
    title.textContent = 'Gallery · ' + char.images.length;
    galleryContent.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'gallery-grid';
    char.images.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      div.onclick = () => openLightbox(char.images, i);
      const isVideo = item.src.match(/\.(mp4|webm|mov)$/i);
      div.innerHTML = `
        ${isVideo ? `<video src="${item.src}" muted loop playsinline></video>` : `<img src="${item.src}" alt="${item.caption || ''}" loading="lazy">`}
        ${item.caption ? `<div class="gallery-caption">${item.caption}</div>` : ''}
      `;
      grid.appendChild(div);
    });
    galleryContent.appendChild(grid);
  }

  if (char.spicy && char.spicy.length) {
    const divider = document.createElement('div');
    divider.className = 'spicy-divider';
    divider.innerHTML = `<div class="line"></div><span class="section-title" style="color: var(--spicy);">Spicy Gens · ${char.spicy.length}</span><div class="line"></div>`;
    galleryContent.appendChild(divider);
    if (ageGateConfirmed) renderSpicy(char);
    else {
      const lockBtn = document.createElement('button');
      lockBtn.className = 'view-btn';
      lockBtn.style.display = 'block';
      lockBtn.style.margin = '20px auto 30px';
      lockBtn.textContent = '🔒 Unlock Spicy (18+)';
      lockBtn.onclick = () => openAgeGate();
      galleryContent.appendChild(lockBtn);
    }
  }

  galleryOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderSpicy(char) {
  const grid = document.createElement('div');
  grid.className = 'gallery-grid';
  char.spicy.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.onclick = () => openLightbox(char.spicy, i);
    const isVideo = item.src.match(/\.(mp4|webm|mov)$/i);
    div.innerHTML = `
      ${isVideo ? `<video src="${item.src}" muted loop playsinline></video>` : `<img src="${item.src}" alt="${item.caption || ''}" loading="lazy">`}
      ${item.caption ? `<div class="gallery-caption">${item.caption}</div>` : ''}
    `;
    grid.appendChild(div);
  });
  galleryContent.appendChild(grid);
}

function closeGalleryOverlay() {
  galleryOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

const lightbox        = document.getElementById('lightbox');
const lightboxContent = document.getElementById('lightboxContent');

function openLightbox(list, idx) {
  currentList = list; lightboxIdx = idx;
  showLb(); lightbox.classList.add('open');
}
function showLb() {
  const item = currentList[lightboxIdx];
  const isVideo = item.src.match(/\.(mp4|webm|mov)$/i);
  lightboxContent.innerHTML = isVideo
    ? `<video src="${item.src}" controls autoplay loop playsinline></video>`
    : `<img src="${item.src}" alt="${item.caption || ''}">`;
}
function closeLightbox() { lightbox.classList.remove('open'); lightboxContent.innerHTML = ''; }
function lbNext() { lightboxIdx = (lightboxIdx + 1) % currentList.length; showLb(); }
function lbPrev() { lightboxIdx = (lightboxIdx - 1 + currentList.length) % currentList.length; showLb(); }

document.addEventListener('keydown', (e) => {
  if (lightbox.classList.contains('open')) {
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') lbNext();
    else if (e.key === 'ArrowLeft') lbPrev();
  } else if (galleryOverlay.classList.contains('open') && e.key === 'Escape') {
    closeGalleryOverlay();
  }
});

const agegate = document.getElementById('agegate');
let ageGateConfirmed = sessionStorage.getItem('ageConfirmed') === 'true';
function openAgeGate() { agegate.classList.add('open'); }
function declineAgeGate() { agegate.classList.remove('open'); }
function confirmAgeGate() {
  ageGateConfirmed = true;
  sessionStorage.setItem('ageConfirmed', 'true');
  agegate.classList.remove('open');
  if (currentChar) {
    galleryContent.innerHTML = '';
    openGallery(GROUP.title, currentChar);
  }
}

// ────────────────────────────────────────────────────────────
//  Drifting paper scraps — loose pages fluttering through air
// ────────────────────────────────────────────────────────────
const scrapsCanvas = document.getElementById('scrapsCanvas');
const scrapsCtx    = scrapsCanvas.getContext('2d');
let scraps = [];

function resizeScraps() {
  scrapsCanvas.width  = window.innerWidth;
  scrapsCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeScraps);
resizeScraps();

function createScrap() {
  return {
    x: Math.random() * scrapsCanvas.width,
    y: scrapsCanvas.height + Math.random() * 100,
    w: 6 + Math.random() * 14,
    h: 8 + Math.random() * 18,
    speedY: 0.2 + Math.random() * 0.6,
    drift: Math.random() * Math.PI * 2,
    driftSpeed: 0.006 + Math.random() * 0.012,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: -0.01 + Math.random() * 0.02,
    opacity: 0.15 + Math.random() * 0.3,
    tone: Math.random() < 0.8 ? 'cream' : 'gold',
  };
}

const scrapCount = Math.min(35, Math.floor(window.innerWidth / 50));
for (let i = 0; i < scrapCount; i++) {
  const s = createScrap();
  s.y = Math.random() * scrapsCanvas.height;
  scraps.push(s);
}

function animateScraps() {
  scrapsCtx.clearRect(0, 0, scrapsCanvas.width, scrapsCanvas.height);

  scraps.forEach(s => {
    scrapsCtx.save();
    scrapsCtx.translate(s.x, s.y);
    scrapsCtx.rotate(s.rotation);
    const color = s.tone === 'gold' ? '226, 194, 128' : '232, 220, 196';
    scrapsCtx.fillStyle = `rgba(${color}, ${s.opacity})`;
    scrapsCtx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
    // Inner darker line to suggest text on the paper
    scrapsCtx.strokeStyle = `rgba(106, 100, 80, ${s.opacity * 0.6})`;
    scrapsCtx.lineWidth = 0.5;
    scrapsCtx.beginPath();
    scrapsCtx.moveTo(-s.w / 2 + 2, -s.h / 4);
    scrapsCtx.lineTo(s.w / 2 - 2, -s.h / 4);
    scrapsCtx.moveTo(-s.w / 2 + 2, 0);
    scrapsCtx.lineTo(s.w / 2 - 2, 0);
    scrapsCtx.moveTo(-s.w / 2 + 2, s.h / 4);
    scrapsCtx.lineTo(s.w / 2 - 2, s.h / 4);
    scrapsCtx.stroke();
    scrapsCtx.restore();

    s.drift += s.driftSpeed;
    s.rotation += s.rotSpeed;
    s.x += Math.sin(s.drift) * 0.4;
    s.y -= s.speedY;
    if (s.y < -30) {
      const ns = createScrap();
      Object.assign(s, ns);
      s.y = scrapsCanvas.height + 10;
    }
  });

  requestAnimationFrame(animateScraps);
}
animateScraps();
</script>
